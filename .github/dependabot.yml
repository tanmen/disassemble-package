version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    reviewers: ["tanmen"]
    schedule:
      interval: "daily"
    # dependencies を含む更新は fix(deps)（版を上げる種別）、devDependencies だけの更新は chore(deps-dev)（上げない）。
    # 利用者に届くのは dist（package.json の依存の範囲を含む）だけで、yarn.lock は届かない。そのため release.yml は
    # paths で yarn.lock を外していて、yarn.lock だけを変える更新（範囲内の上げ・推移依存の更新）は fix(deps) でも
    # npm に出さない。npm に出るのは package.json の範囲を変える更新（major など）だけ。
    # ⚠ 推移依存のセキュリティ更新は、開発用の依存の下にあっても fix(deps) で来ることがある
    #   （dependabot が lockfile から開発用と判定できないと本番扱いにする）。yarn.lock だけの変更なので出ない。
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    reviewers: ["tanmen"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
