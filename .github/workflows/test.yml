name: CI/CD
on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  node-version: 22.x

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      # The github-actions reporter turns failed tests into annotations; it needs no token.
      # Keep --reporters last: it also swallows any positional argument after it.
      - name: Test
        run: yarn test --coverage --reporters=default --reporters=github-actions
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  # "Test" runs Node 22, the lowest supported (engines in package.json); a matrix there would
  # rename that required check to "Test (22.x)" and block every PR. Newer Node lines run here;
  # they are required checks too, and License waits for them. Publishing to npm is release.yml,
  # which runs the same Node lines again before it publishes.
  TestNewerNode:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 24.x, 26.x ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
  # Stays on every push to main rather than moving to release.yml: it reports main's dependency
  # set (it changes with each dependabot merge, released or not) behind the FOSSA badge.
  License:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [ Test, TestNewerNode, Build ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Check license
        uses: fossas/fossa-action@v2
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
