name: CI/CD
on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  node-version: 22.x

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
  Test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test --coverage --json --outputFile=result.json --testLocationInResults
      - name: Report
        uses: tanmen/jest-reporter@v1
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  # "Test" runs Node 22, the lowest supported (engines in package.json); a matrix there would
  # rename that required check to "Test (22.x)" and block every PR. Newer Node lines run here;
  # they are required checks too, and Publish / License wait for them.
  TestNewerNode:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 24.x, 26.x ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
  Publish:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [ Test, TestNewerNode, Build ]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC); provenance is attached automatically
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
          # No registry-url: with it, setup-node v7 runs `yarn cache dir` against an .npmrc
          # holding an unset ${NODE_AUTH_TOKEN} and yarn 1 aborts. npm auth is OIDC instead.
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Publish
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
  License:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [ Test, TestNewerNode, Build ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Check license
        uses: fossas/fossa-action@v2
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
